server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: time-slot-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/meeting_room?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  configuration:
    map-underscore-to-camel-case: true

timeslot:
  jwt:
    secret: ${JWT_SECRET:time-slot-team-ready-baseline-v0-2-secret-key-please-change}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}

