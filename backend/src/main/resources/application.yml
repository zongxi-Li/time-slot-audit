# 文件职责：Spring Boot 运行配置，定义服务端口、MySQL 数据源、MyBatis 和 JWT 参数。
# 接口：读取 DB_URL、DB_USERNAME、DB_PASSWORD、JWT_SECRET 等环境变量。
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: time-slot-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/meeting_room?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  configuration:
    map-underscore-to-camel-case: true

timeslot:
  jwt:
    # 必须通过环境变量 JWT_SECRET 显式提供（至少 32 字符）；
    # 未提供时 JwtService 在启动阶段 fail-fast，不再存在公开默认密钥。
    secret: ${JWT_SECRET:}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}

